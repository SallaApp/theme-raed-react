name: Theme Raed React — PR gates

# Two stages (docs/merge-queue.md). Stage 1 is the pull request: the real Greptile app, the organisation's validators and the fast
# tier report on it. Stage 2 is the merge queue (pr-gates-merge-group.yml).
# `PR gates` runs on both and is the anti-spoof gate: the required checks must come from their real apps, not from a workflow that
# borrows a name. It is re-run by pr-gates-rerun.yml when Greptile or a validator finishes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  checks: read

defaults:
  run:
    shell: bash

jobs:
  # Passes only when `Greptile Review` on the head of the pull request (every pull request of a merge group) was reported by the Greptile
  # app (id 867647), the title and branch validators by their real app, no review thread is open and the pull request is not a draft.
  pr-gates:
    name: PR gates
    runs-on: ${{ vars.RUNS_ON && fromJson(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Evaluate the gates
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/ci/prGatesCli.ts
