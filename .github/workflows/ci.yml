name: CI

# Quality gates. A draft runs nothing; a pull request that is ready for review runs every gate on each push.
# Reports (coverage, bundle size) are printed in the job log and shown in the run summary: no API calls, no extra credentials.
on:
  pull_request:
    branches:
      - master
      - feature/quality-gates-twig-parity-audit
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - feature/quality-gates-twig-parity-audit

# A draft run skips every job, so it gets its own group: sharing one with the real run could cancel the
# ready_for_review run.
concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Lint & Static Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm and Node
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Check manifest
        run: pnpm check:manifest
      - name: Dead code (knip)
        run: pnpm knip

  unit:
    name: Unit Tests & Coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm and Node
        uses: ./.github/actions/setup
      - name: Run unit tests and enforce the coverage floor
        run: pnpm test:coverage
      - name: Write the coverage report
        if: always()
        run: |
          mkdir -p report
          {
            echo "### Unit tests and coverage"
            if [ -f coverage/coverage-summary.json ]; then
              echo
              echo "| Metric | Covered | Total | % |"
              echo "| --- | --- | --- | --- |"
              jq -r '.total | to_entries[] | select(.key | IN("lines","statements","functions","branches")) | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct) |"' coverage/coverage-summary.json
            else
              echo
              echo "No coverage summary was produced."
            fi
          } > report/coverage.md
          cat report/coverage.md
          cat report/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build, Types & Bundle Size
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm and Node
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      # Typecheck needs app/routeTree.gen.ts, which the build generates on a clean checkout.
      - name: Typecheck
        run: pnpm typecheck
      - name: Write the bundle size report
        if: always()
        run: |
          mkdir -p report
          {
            echo "### Bundle size"
            if [ -d dist ]; then
              echo
              echo "Total build output: $(du -sh dist | cut -f1)"
              echo
              echo "Largest JS and CSS files:"
              echo
              echo '```'
              find dist -type f \( -name '*.js' -o -name '*.css' \) -printf '%s %p\n' | sort -rn | head -15 | awk '{printf "%8.1f KB  %s\n", $1/1024, $2}'
              echo '```'
            else
              echo
              echo "The build produced no output."
            fi
          } > report/size.md
          cat report/size.md
          cat report/size.md >> "$GITHUB_STEP_SUMMARY"

  # One verdict over every gate above: the single check to require in a branch ruleset.
  testing-result:
    name: Testing Ready
    needs: [static, unit, build]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Gate results"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
