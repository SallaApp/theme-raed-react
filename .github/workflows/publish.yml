name: Publish starter kit

# Every merge to master publishes this theme to npm as @salla.sa/theme-raed, the starter kit
# `salla theme create --type react` scaffolds from, and tags the commit theme-raed-v<version>.

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.repository == 'SallaApp/theme-raed-react'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The kit excludes the repo's own files and the lockfile, and ships `.gitignore` undotted:
      # npm pack drops a dotted one, and the CLI's scaffold restores the dot.
      - name: Stage the kit
        run: |
          STAGE="$RUNNER_TEMP/kit"
          mkdir -p "$STAGE"
          git archive HEAD | tar -x -C "$STAGE"
          rm -rf "$STAGE/.github" "$STAGE/pnpm-lock.yaml"
          mv "$STAGE/.gitignore" "$STAGE/gitignore"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # The next patch after npm's latest, or package.json's version when a PR raised it past that.
      - name: Pick the version
        id: version
        run: |
          LATEST=$(npm view @salla.sa/theme-raed version)
          VERSION=$(node -e '
            const [own, latest] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const next = [latest[0], latest[1], latest[2] + 1];
            const newer = own[0] - next[0] || own[1] - next[1] || own[2] - next[2];
            console.log((newer > 0 ? own : next).join("."));
          ' "$(node -p 'require("./package.json").version')" "$LATEST")
          echo "npm latest ${LATEST}, releasing ${VERSION}"
          (cd "$STAGE" && npm version "$VERSION" --no-git-tag-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_PUBLISH_TOKEN is not available to this repository."
            exit 1
          fi
          cd "$STAGE"
          npm publish --access public --tag latest

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: theme-raed-v${{ steps.version.outputs.version }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
